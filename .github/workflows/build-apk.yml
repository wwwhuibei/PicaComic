name: Build PicaComic APK (GPU fix)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Install CMake for native plugins
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(command -v sdkmanager)"
          fi
          echo "sdkmanager: $SM"
          yes | "$SM" "cmake;3.10.2.4988404"
          echo "--- installed cmake ---"
          ls "$SDK/cmake"
          test -d "$SDK/cmake/3.10.2.4988404"

      - name: Apply GPU fix patch
        env:
          PATCH_B64: ""
        run: |
          set -e
          echo "$PATCH_B64" | base64 -d > /tmp/fix.patch
          echo "--- patch preview ---"
          head -25 /tmp/fix.patch
          if git apply -v /tmp/fix.patch; then
            echo "git apply succeeded"
          else
            echo "git apply failed, falling back to patch(1)"
            patch -p1 --forward --fuzz=3 < /tmp/fix.patch
          fi
          echo "--- verify ---"
          grep -q "EnableImpeller" android/app/src/main/AndroidManifest.xml && echo "OK 1/4 impeller disabled"
          grep -q "_limitDecodeSize" lib/pages/reader/reading_data.dart && echo "OK 2/4 decode size limited"
          grep -q "AppLifecycleState.resumed &&" lib/main.dart && echo "OK 3/4 refresh rate guarded"
          grep -q "cookies3" lib/pages/ehentai/eh_login_page.dart && echo "OK 4/4 ehentai cookie fix"

      - name: Tune gradle memory
        run: |
          sed -i 's/-Xmx1536M/-Xmx4096M/' android/gradle.properties || true
          cat android/gradle.properties

      - name: Restore fixed signing key
        env:
          KEYSTORE_B64: ""
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > android/app/pica.p12
          ls -l android/app/pica.p12
          cd android
          printf 'storeFile=pica.p12\nstorePassword=pica123456\nkeyAlias=pica\nkeyPassword=pica123456\n' > key.properties
          echo "--- key.properties ---"
          cat key.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Collect output
        if: always()
        run: |
          mkdir -p out
          find build/app/outputs -name "*.apk" -exec cp {} out/ \; || true
          echo "--- APK list ---"
          ls -lh out || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pica-comic-fixed-apk
          path: out/*.apk
          if-no-files-found: warn
